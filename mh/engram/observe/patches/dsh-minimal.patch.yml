# 观察者用的 dsh headless 极简层：叠加在借用 ark provider 的 web 补丁之后。
# headless 的一次性运行器不组合 agent 预设，所以不能选 minimal 预设；这里直接禁用 dsh-base 里提供工具、
# 技能、子代理、目标、计划模式和工作区指令（AGENTS.md）的插件，并清空 headless 的人设，
# 让模型只看到我们拼好的提示词。这份文件计入 Operator：改它就是新的观察者。
- id: system-prompt
  config:
    personaPrefix: ''
    personaSuffix: ''
- id: agent-instructions
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
