# memory-harness 的实例配置示例：复制到 ~/.config/memory-harness/instance.toml 再改（或用 MH_INSTANCE 指定路径）。
# 每一项都可以不写，不写用默认。

projects = "~/projects"                          # 放项目的目录：Synapse 认不出 git 仓库时，取这下面的第一层目录当工作区

[user]
name = "用户"                                    # 写记录、填提示词用的称呼（默认“用户”）
aliases = []                                     # 另外的称呼：识别与检索候选；同名按上下文判断，通用角色词不加入个人组

[workspace.engram]                               # Engram 按目录更正工作区：最长前缀；其余取会话 cwd 的最后一节
# "~/projects/old-name" = "new-name"

[workspace.managing]                             # 管理性质的工作区：会话可以挂到目录下任何一个工作区的线
# home = "~"

[workspace.synapse]                              # Synapse 的改名、删除、别名：按路径前缀，最长的优先
# "~/projects/old-name" = "new-name"

# [[workspace.sessions]]                         # 按会话更正工作区
# source = "claude"
# session = "<会话 id>"
# workspace = "<工作区>"

[synapse]
quiet = []                                       # 不当“查不到的词”送的词（手动名单）

[tools]
# codex = "codex"                                # codex CLI 的路径（默认按 PATH 找）
# dsh_test = "/usr/local/mh-tools/dsh-observe"    # mh 专用的 dsh 实例（精读）：env/ 程序、home/ 是 DSH_HOME

[vector]                                        # 检索面的向量一路（Synapse v0.33）：服务端是 mh/synapse/pull/vector_serve.py，跑在有 numpy 和 bge-m3 的机器上
# url = "http://127.0.0.1:28082"                 # 不写就只有字面一路
# key_file = "~/.config/memory-harness/vector.key"

[invoke]                                        # 远端调用（mh engram serve）：只能在一台机器上跑的模型定义由它代跑
# listen = "127.0.0.1:3090"                      # 服务端听哪里（默认只听本机）
# token = ""                                     # 两边一样；不写就不开放

[invoke.remote]                                  # 客户端：哪些模型定义转发到哪里；没写的在本机跑
# "deepseek-oc-web-deep" = "http://linux-box:3090"

[listen]                                        # 监听 QQ 协议端（mh listen）：OneBot 11 正向 WS
# remote = "127.0.0.1:3001"                     # 协议端的 WS（在 ssh 那台机器上看）
# ssh = "qq-box"                                  # 协议端只听另一台机器的本机时，经这台 ssh 隧道连；不写就直连 remote
# local = 13001                                 # 隧道在本机的端口
# token_file = "~/.config/memory-harness/qq-onebot.key"   # 协议端配的 token

[reply]                                         # 回复（mh reply）：在一个群里被叫到时回几句；连接沿用 [listen]
# group = 123456789                             # 只在这个群里回
# names = ["小号的昵称"]                         # 文字里出现这些名字也算叫到（@、回复我的消息总算）
# ignore = []                                   # 不回这些号（群里别的 bot）
# model = "gpt-6.1-terra"                       # codex 上的模型；effort 默认 low
# private = []                                 # 只回这些号的私聊（说了就回）
# owner = []                                   # 用户自己的号：叫我、私聊都不计额度
# bots = []                                    # 群里的 bot：只有它叫我的，算 bot_hourly
# hourly_max = 30                              # 总量（每小时）：别人叫我、跟复读、主动接话发出去的，含 bot 那份
# bot_hourly = 10
# proactive_hourly = 4                         # 主动接话每小时最多问几次（问了不接也算）
# proactive_gap_minutes = 10
# proactive_after = 8                          # 上次说话后又有几条别人的话才看一眼
# echo_after = 2                                # 几个不同的人复读了就跟一句（0 不跟）
# effort = "medium"
# hint_chars = 60                               # 提示词里要求的字数
# max_chars = 100                               # 硬上限：超了重写一次，还超就截
# day_hour = 7                                  # 每天几点切段（本地时间）
# gap_minutes = 30                              # 隔多久没人说话也切段
# persona = "~/chat/AGENTS.md"            # 人设
# local = 13002                                 # 自己那条隧道在本机的端口

[resources]                                     # 私有文本，独立于代码和发行包
# core = "~/.config/memory-harness/core.md"         # 内核（手记里不变的那部分）；2026-10-24 前叫 standing
# glossary = "~/.config/memory-harness/glossary.md"
# workspace_status = "~/.config/memory-harness/workspace-status"

[review]                                        # 给用户看的预览站：发布的页面链接是一次性的，form 写陈述时去掉
# url = "https://preview.example.org/"

[show]                                          # 展示自己的窗口（mh rhythm --show）：只读网页，打开时现编
# listen = "127.0.0.1:3089"                     # 只听这个地址（例如 tailscale 的地址），由前面的 nginx 管登录
# allow = ["127.0.0.1"]                         # 只放这些来源进来
# local_model = "http://192.0.2.20:28080"       # 本地模型服务（看加载了哪个）；不写就不看
# local_model_key = "~/.config/memory-harness/local-model.key"
# local_model_status = "local_model.json"       # 占用记录（数据目录下；占用的任务自己写）；照看在有人占着时不用本地模型
# local_model_host = "studio"                   # 本地模型在 [[show.hosts]] 里的哪台：模型和它的 launchd 服务并进那张卡；不写就单列、不量服务
# dsh_port = 3080                               # 宿主 dsh 的端口（重启后看它在不在）
# backup_unit = "dsh-backup.service"            # 每天备份的用户级 unit
# chain = "协议端 → ssh 隧道 → listen 记、reply 回"   # QQ 那一格的一行说明
# review_ctl = "~/review-station/ctl.py"        # 预览站的 ctl.py：近几天发的页面留没留输入；不写就不看
# raid = "md0"                                  # RAID 阵列（/proc/mdstat、/sys/block/<名>/md）
# patrol = "/var/lib/nas-patrol/last.status"    # 每天巡检的结论（key=value，exit 0/1/2）；patrol_log 给 WARN/CRIT 行
# proxy_api = "http://127.0.0.1:9090"           # mihomo / clash 的 external-controller：连接数、累计流量
# [[show.units]]                                # 本机 mh 以外的服务：name、unit、scope（user / system）、group、note；
                                                # 可选 log（路径里可写 {%Y-%m-%d}）和 err（正则），数近一小时出错行
# [[show.entries]]                              # 入口：name、url、note
# [[show.hosts]]                                # 机器：name、note；写了 os（linux / mac / windows）的会被量占用，别的机器加 ssh 别名
# [[show.paths]]                                # 东西都在哪：name、path、note
