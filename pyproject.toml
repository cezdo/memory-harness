[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-harness"
version = "0.1.1"
description = "Traceable memory across AI conversations and workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.scripts]
mh = "mh.__main__:main"

[tool.setuptools.packages.find]
include = ["mh*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.toml", "*.yml", "*.json", "*.js", "**/*.md", "**/*.toml", "**/*.yml", "**/*.json", "**/*.js"]
